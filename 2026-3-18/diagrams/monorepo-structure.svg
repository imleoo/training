<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .title { font: bold 20px sans-serif; fill: #1a1a1a; }
      .subtitle { font: 14px sans-serif; fill: #666; }
      .box { fill: #f8f9fa; stroke: #2563eb; stroke-width: 2; }
      .box-ghost { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; }
      .box-apps { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .box-e2e { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .label { font: bold 14px sans-serif; fill: #1a1a1a; }
      .item { font: 12px sans-serif; fill: #4b5563; }
      .line { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="400" y="30" class="title" text-anchor="middle">Ghost Monorepo 结构</text>
  <text x="400" y="50" class="subtitle" text-anchor="middle">Yarn v1 Workspaces + Nx</text>

  <!-- ghost/* workspace -->
  <rect x="50" y="80" width="220" height="180" class="box-ghost" rx="5"/>
  <text x="160" y="105" class="label" text-anchor="middle">ghost/*</text>
  <text x="70" y="130" class="item">ghost/core</text>
  <text x="90" y="150" class="item" font-size="11">• Node.js/Express 后端</text>
  <text x="90" y="165" class="item" font-size="11">• 主题渲染引擎</text>
  <text x="70" y="190" class="item">ghost/admin</text>
  <text x="90" y="210" class="item" font-size="11">• Ember.js (legacy)</text>
  <text x="70" y="235" class="item">ghost/i18n</text>
  <text x="90" y="255" class="item" font-size="11">• 60+ 语言支持</text>

  <!-- apps/* workspace -->
  <rect x="290" y="80" width="460" height="450" class="box-apps" rx="5"/>
  <text x="520" y="105" class="label" text-anchor="middle">apps/*</text>

  <!-- Admin Apps -->
  <rect x="310" y="120" width="200" height="150" class="box" rx="3"/>
  <text x="410" y="140" class="label" text-anchor="middle" font-size="13">Admin Apps (React)</text>
  <text x="320" y="160" class="item" font-size="11">admin-x-settings</text>
  <text x="320" y="175" class="item" font-size="11">admin-x-activitypub</text>
  <text x="320" y="190" class="item" font-size="11">posts</text>
  <text x="320" y="205" class="item" font-size="11">stats</text>
  <text x="320" y="225" class="item" font-size="10" fill="#666">嵌入 Ghost Admin</text>
  <text x="320" y="240" class="item" font-size="10" fill="#666">Vite + React + TanStack</text>

  <!-- Public Apps -->
  <rect x="530" y="120" width="200" height="150" class="box" rx="3"/>
  <text x="630" y="140" class="label" text-anchor="middle" font-size="13">Public Apps (UMD)</text>
  <text x="540" y="160" class="item" font-size="11">portal</text>
  <text x="540" y="175" class="item" font-size="11">comments-ui</text>
  <text x="540" y="190" class="item" font-size="11">signup-form</text>
  <text x="540" y="205" class="item" font-size="11">sodo-search</text>
  <text x="540" y="225" class="item" font-size="10" fill="#666">CDN 分发</text>
  <text x="540" y="240" class="item" font-size="10" fill="#666">主题加载</text>

  <!-- Foundation Libraries -->
  <rect x="310" y="290" width="420" height="220" class="box" rx="3"/>
  <text x="520" y="310" class="label" text-anchor="middle" font-size="13">Foundation Libraries</text>

  <rect x="330" y="325" width="180" height="70" class="box" rx="2"/>
  <text x="420" y="345" class="item" text-anchor="middle" font-weight="bold">shade</text>
  <text x="340" y="365" class="item" font-size="10">新设计系统</text>
  <text x="340" y="380" class="item" font-size="10">shadcn/ui + Radix</text>

  <rect x="530" y="325" width="180" height="70" class="box" rx="2"/>
  <text x="620" y="345" class="item" text-anchor="middle" font-weight="bold">admin-x-design-system</text>
  <text x="540" y="365" class="item" font-size="10">旧设计系统</text>
  <text x="540" y="380" class="item" font-size="10">逐步淘汰中</text>

  <rect x="330" y="410" width="380" height="80" class="box" rx="2"/>
  <text x="520" y="430" class="item" text-anchor="middle" font-weight="bold">admin-x-framework</text>
  <text x="340" y="450" class="item" font-size="10">• API hooks (useBrowse, useEdit, useAdd, useDelete)</text>
  <text x="340" y="465" class="item" font-size="10">• 路由和工具函数</text>
  <text x="340" y="480" class="item" font-size="10">• 共享业务逻辑</text>

  <!-- e2e/ workspace -->
  <rect x="50" y="280" width="220" height="100" class="box-e2e" rx="5"/>
  <text x="160" y="305" class="label" text-anchor="middle">e2e/</text>
  <text x="70" y="330" class="item">Playwright 测试</text>
  <text x="70" y="350" class="item" font-size="11">• Docker 容器隔离</text>
  <text x="70" y="365" class="item" font-size="11">• 端到端浏览器测试</text>

  <!-- Dependency arrows -->
  <path d="M 270 170 L 290 170" class="line" marker-end="url(#arrowhead)"/>
  <path d="M 160 260 L 160 280" class="line" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="400" y="570" class="item" text-anchor="middle" fill="#666">构建工具: Nx 管理依赖 | 包管理: Yarn v1 Workspaces</text>
</svg>