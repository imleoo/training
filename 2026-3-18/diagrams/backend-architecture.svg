<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <style>
      .title { font: bold 20px sans-serif; fill: #1a1a1a; }
      .layer-title { font: bold 16px sans-serif; fill: #1a1a1a; }
      .box { fill: #f8f9fa; stroke: #2563eb; stroke-width: 2; }
      .layer { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; }
      .item { font: 12px sans-serif; fill: #4b5563; }
      .count { font: bold 11px sans-serif; fill: #059669; }
      .line { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="450" y="30" class="title" text-anchor="middle">Ghost 后端架构 (ghost/core)</text>

  <!-- Entry Point -->
  <rect x="350" y="60" width="200" height="60" class="box" rx="5"/>
  <text x="450" y="85" class="layer-title" text-anchor="middle">入口点</text>
  <text x="360" y="105" class="item">index.js → ghost.js → core/boot.js</text>

  <!-- HTTP Server Layer -->
  <rect x="50" y="150" width="800" height="80" class="layer" rx="5"/>
  <text x="450" y="175" class="layer-title" text-anchor="middle">HTTP 服务器层</text>
  <text x="70" y="200" class="item">GhostServer (Express)</text>
  <text x="70" y="215" class="item">• 端口: 2368 (默认)</text>
  <text x="300" y="200" class="item">中间件</text>
  <text x="300" y="215" class="item">• 认证、日志、错误处理</text>
  <text x="550" y="200" class="item">静态资源</text>
  <text x="550" y="215" class="item">• 主题、图片、Admin UI</text>

  <!-- Web Application Layer -->
  <rect x="50" y="260" width="800" height="100" class="layer" rx="5"/>
  <text x="450" y="285" class="layer-title" text-anchor="middle">Web 应用层</text>
  <rect x="70" y="295" width="160" height="50" class="box" rx="3"/>
  <text x="150" y="315" class="item" text-anchor="middle" font-weight="bold">Parent App</text>
  <text x="80" y="335" class="item" font-size="10">根路由</text>

  <rect x="250" y="295" width="140" height="50" class="box" rx="3"/>
  <text x="320" y="315" class="item" text-anchor="middle" font-weight="bold">API App</text>
  <text x="260" y="335" class="item" font-size="10">/ghost/api/*</text>

  <rect x="410" y="295" width="140" height="50" class="box" rx="3"/>
  <text x="480" y="315" class="item" text-anchor="middle" font-weight="bold">Admin App</text>
  <text x="420" y="335" class="item" font-size="10">/ghost/*</text>

  <rect x="570" y="295" width="160" height="50" class="box" rx="3"/>
  <text x="650" y="315" class="item" text-anchor="middle" font-weight="bold">Members App</text>
  <text x="580" y="335" class="item" font-size="10">会员认证</text>

  <!-- API Endpoints Layer -->
  <rect x="50" y="390" width="800" height="80" class="layer" rx="5"/>
  <text x="450" y="415" class="layer-title" text-anchor="middle">API 端点层</text>
  <text x="450" y="435" class="count" text-anchor="middle">(69 个端点)</text>
  <text x="70" y="450" class="item">posts, pages, tags, users, members, settings, themes...</text>
  <text x="70" y="465" class="item">路径: ghost/core/core/server/api/endpoints/</text>

  <!-- Services Layer -->
  <rect x="50" y="500" width="800" height="80" class="layer" rx="5"/>
  <text x="450" y="525" class="layer-title" text-anchor="middle">服务层</text>
  <text x="450" y="545" class="count" text-anchor="middle">(68 个服务)</text>
  <text x="70" y="560" class="item">auth, email, webhooks, stripe, analytics, media...</text>
  <text x="70" y="575" class="item">路径: ghost/core/core/server/services/</text>

  <!-- Data Models Layer -->
  <rect x="50" y="610" width="380" height="70" class="layer" rx="5"/>
  <text x="240" y="635" class="layer-title" text-anchor="middle">数据模型层</text>
  <text x="240" y="655" class="count" text-anchor="middle">(72 个模型 - Bookshelf ORM)</text>
  <text x="70" y="670" class="item">路径: ghost/core/core/server/models/</text>

  <!-- Database Layer -->
  <rect x="470" y="610" width="380" height="70" class="layer" rx="5"/>
  <text x="660" y="635" class="layer-title" text-anchor="middle">数据库层</text>
  <text x="660" y="655" class="item" text-anchor="middle">MySQL 8.4.5 + Redis 7.0</text>
  <text x="480" y="670" class="item">Knex 查询构建器 + 迁移</text>

  <!-- Arrows -->
  <path d="M 450 120 L 450 150" class="line"/>
  <path d="M 450 230 L 450 260" class="line"/>
  <path d="M 450 360 L 450 390" class="line"/>
  <path d="M 450 470 L 450 500" class="line"/>
  <path d="M 240 580 L 240 610" class="line"/>
  <path d="M 660 580 L 660 610" class="line"/>
</svg>