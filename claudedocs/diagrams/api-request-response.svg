<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .flow-box { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
      .auth-box { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .error-box { fill: #fecaca; stroke: #dc2626; stroke-width: 2; }
      .success-box { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: Arial, sans-serif; font-size: 10px; fill: #475569; }
      .code { font-family: monospace; font-size: 9px; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-success { stroke: #059669; stroke-width: 2; fill: none; marker-end: url(#arrowhead-success); }
      .arrow-error { stroke: #dc2626; stroke-width: 2; fill: none; marker-end: url(#arrowhead-error); }
      .section-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .step-circle { fill: #0284c7; stroke: #075985; stroke-width: 2; }
      .step-number { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-success" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#059669" />
    </marker>
    <marker id="arrowhead-error" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="section-title">Ghost API 请求-响应流程</text>

  <!-- Client Request -->
  <circle cx="60" cy="80" r="18" class="step-circle"/>
  <text x="60" y="86" text-anchor="middle" class="step-number">1</text>

  <rect x="100" y="50" width="350" height="120" class="flow-box" rx="5"/>
  <text x="275" y="70" text-anchor="middle" class="title">客户端请求</text>
  <text x="120" y="90" class="code">POST /ghost/api/admin/posts/ HTTP/1.1</text>
  <text x="120" y="105" class="code">Authorization: Bearer eyJhbGciOiJ...</text>
  <text x="120" y="120" class="code">Content-Type: application/json</text>
  <text x="120" y="135" class="code"></text>
  <text x="120" y="150" class="code">{"posts": [{"title": "My Post", ...}]}</text>

  <path d="M 275 170 L 275 210" class="arrow"/>

  <!-- Authentication -->
  <circle cx="60" cy="240" r="18" class="step-circle"/>
  <text x="60" y="246" text-anchor="middle" class="step-number">2</text>

  <rect x="100" y="210" width="350" height="100" class="auth-box" rx="5"/>
  <text x="275" y="230" text-anchor="middle" class="title">JWT 认证验证</text>
  <text x="120" y="250" class="subtitle">1. 提取 Bearer Token</text>
  <text x="120" y="265" class="subtitle">2. 验证签名: jwt.verify(token, secret)</text>
  <text x="120" y="280" class="subtitle">3. 检查有效期: exp timestamp</text>
  <text x="120" y="295" class="subtitle">4. 加载用户: User.findOne({id: decoded.sub})</text>

  <!-- Auth Decision -->
  <path d="M 275 310 L 275 340" class="arrow"/>

  <polygon points="275,340 340,370 275,400 210,370" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="275" y="368" text-anchor="middle" class="title">Token</text>
  <text x="275" y="382" text-anchor="middle" class="title">有效?</text>

  <!-- Success Path -->
  <path d="M 340 370 L 400 370 L 400 430" class="arrow-success"/>
  <text x="350" y="365" class="subtitle">✓ 是</text>

  <circle cx="60" cy="460" r="18" class="step-circle"/>
  <text x="60" y="466" text-anchor="middle" class="step-number">3</text>

  <rect x="100" y="430" width="350" height="100" class="flow-box" rx="5"/>
  <text x="275" y="450" text-anchor="middle" class="title">权限检查</text>
  <text x="120" y="470" class="subtitle">1. 获取用户角色</text>
  <text x="120" y="485" class="subtitle">2. 检查操作权限: canThis(user).add.post()</text>
  <text x="120" y="500" class="subtitle">3. 验证资源访问权限</text>
  <text x="120" y="515" class="subtitle">4. 检查不安全属性: unsafeAttrs</text>

  <path d="M 275 530 L 275 560" class="arrow"/>

  <!-- Permission Decision -->
  <polygon points="275,560 340,590 275,620 210,590" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="275" y="588" text-anchor="middle" class="title">有权限?</text>

  <!-- Success Path 2 -->
  <path d="M 340 590 L 400 590 L 400 650" class="arrow-success"/>
  <text x="350" y="585" class="subtitle">✓ 是</text>

  <circle cx="60" cy="680" r="18" class="step-circle"/>
  <text x="60" y="686" text-anchor="middle" class="step-number">4</text>

  <rect x="100" y="650" width="350" height="80" class="flow-box" rx="5"/>
  <text x="275" y="670" text-anchor="middle" class="title">API 端点处理</text>
  <text x="120" y="690" class="subtitle">1. 参数验证: validation schema</text>
  <text x="120" y="705" class="subtitle">2. 调用业务逻辑: models.Post.add(...)</text>
  <text x="120" y="720" class="subtitle">3. 格式化响应: model.toJSON()</text>

  <path d="M 275 730 L 275 770" class="arrow"/>

  <!-- Success Response -->
  <circle cx="60" cy="800" r="18" class="step-circle"/>
  <text x="60" y="806" text-anchor="middle" class="step-number">5</text>

  <rect x="100" y="770" width="350" height="100" class="success-box" rx="5"/>
  <text x="275" y="790" text-anchor="middle" class="title">成功响应</text>
  <text x="120" y="810" class="code">HTTP/1.1 201 Created</text>
  <text x="120" y="825" class="code">Content-Type: application/json</text>
  <text x="120" y="840" class="code"></text>
  <text x="120" y="855" class="code">{"posts": [{"id": "...", "title": "..."}]}</text>

  <!-- Error Paths -->
  <!-- Auth Error -->
  <path d="M 210 370 L 150 370 L 150 430" class="arrow-error"/>
  <text x="160" y="365" class="subtitle">✗ 否</text>

  <rect x="520" y="340" width="300" height="70" class="error-box" rx="5"/>
  <text x="670" y="360" text-anchor="middle" class="title">401 Unauthorized</text>
  <text x="540" y="380" class="code">{"errors": [{</text>
  <text x="540" y="395" class="code">  "message": "Authentication failed"</text>
  <text x="540" y="410" class="code">}]}</text>

  <path d="M 150 430 L 150 375 L 520 375" class="arrow-error"/>

  <!-- Permission Error -->
  <path d="M 210 590 L 150 590 L 150 650" class="arrow-error"/>
  <text x="160" y="585" class="subtitle">✗ 否</text>

  <rect x="520" y="560" width="300" height="70" class="error-box" rx="5"/>
  <text x="670" y="580" text-anchor="middle" class="title">403 Forbidden</text>
  <text x="540" y="600" class="code">{"errors": [{</text>
  <text x="540" y="615" class="code">  "message": "No permission to add posts"</text>
  <text x="540" y="630" class="code">}]}</text>

  <path d="M 150 650 L 150 595 L 520 595" class="arrow-error"/>

  <!-- Validation Error -->
  <rect x="520" y="720" width="300" height="80" class="error-box" rx="5"/>
  <text x="670" y="740" text-anchor="middle" class="title">422 Unprocessable Entity</text>
  <text x="540" y="760" class="code">{"errors": [{</text>
  <text x="540" y="775" class="code">  "message": "Title is required",</text>
  <text x="540" y="790" class="code">  "property": "title"</text>
  <text x="540" y="805" class="code">}]}</text>

  <path d="M 450 690 L 520 760" class="arrow-error" stroke-dasharray="3,3"/>

  <!-- Right Side: Query Parameters -->
  <text x="880" y="60" class="section-title">查询参数</text>

  <rect x="880" y="75" width="280" height="180" class="flow-box" rx="5"/>
  <text x="1020" y="95" text-anchor="middle" class="title">通用参数</text>
  <text x="900" y="115" class="subtitle">• include - 包含关联资源</text>
  <text x="910" y="130" class="code">?include=tags,authors</text>
  <text x="900" y="150" class="subtitle">• fields - 字段选择</text>
  <text x="910" y="165" class="code">?fields=title,slug</text>
  <text x="900" y="185" class="subtitle">• filter - NQL 过滤</text>
  <text x="910" y="200" class="code">?filter=status:published</text>
  <text x="900" y="220" class="subtitle">• limit &amp; page - 分页</text>
  <text x="910" y="235" class="code">?limit=15&amp;page=2</text>

  <rect x="880" y="270" width="280" height="120" class="flow-box" rx="5"/>
  <text x="1020" y="290" text-anchor="middle" class="title">NQL 过滤示例</text>
  <text x="900" y="310" class="code">• tag:news</text>
  <text x="900" y="325" class="code">• status:published+featured:true</text>
  <text x="900" y="340" class="code">• author.slug:john</text>
  <text x="900" y="355" class="code">• published_at:&gt;2026-01-01</text>
  <text x="900" y="370" class="code">• visibility:members</text>

  <!-- Response Headers -->
  <rect x="880" y="405" width="280" height="140" class="flow-box" rx="5"/>
  <text x="1020" y="425" text-anchor="middle" class="title">响应头</text>
  <text x="900" y="445" class="subtitle">缓存控制:</text>
  <text x="910" y="460" class="code">Cache-Control: private, no-cache</text>
  <text x="900" y="480" class="subtitle">缓存清除:</text>
  <text x="910" y="495" class="code">X-Cache-Invalidate: /*</text>
  <text x="900" y="515" class="subtitle">分页信息:</text>
  <text x="910" y="530" class="code">X-Pagination-Total: 100</text>

  <!-- Rate Limiting -->
  <rect x="880" y="560" width="280" height="120" class="flow-box" rx="5"/>
  <text x="1020" y="580" text-anchor="middle" class="title">速率限制</text>
  <text x="900" y="600" class="subtitle">Admin API:</text>
  <text x="910" y="615" class="code">1000 请求/小时/用户</text>
  <text x="900" y="635" class="subtitle">Content API:</text>
  <text x="910" y="650" class="code">无限制 (仅读取)</text>
  <text x="900" y="670" class="subtitle">超限响应: 429 Too Many Requests</text>

  <!-- Error Codes -->
  <rect x="880" y="695" width="280" height="175" class="error-box" rx="5"/>
  <text x="1020" y="715" text-anchor="middle" class="title">HTTP 状态码</text>
  <text x="900" y="735" class="subtitle">200 OK - 成功</text>
  <text x="900" y="750" class="subtitle">201 Created - 创建成功</text>
  <text x="900" y="765" class="subtitle">204 No Content - 删除成功</text>
  <text x="900" y="780" class="subtitle">400 Bad Request - 请求错误</text>
  <text x="900" y="795" class="subtitle">401 Unauthorized - 未认证</text>
  <text x="900" y="810" class="subtitle">403 Forbidden - 无权限</text>
  <text x="900" y="825" class="subtitle">404 Not Found - 资源不存在</text>
  <text x="900" y="840" class="subtitle">422 Unprocessable - 验证失败</text>
  <text x="900" y="855" class="subtitle">429 Too Many Requests - 超限</text>
</svg>
