<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变和阴影 -->
  <defs>
    <linearGradient id="layerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="clientGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="webGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="apiGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="modelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="700" fill="#f8fafc"/>
  
  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e293b">Ghost 架构层次图</text>
  <text x="450" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">请求流经的六个主要层次</text>
  
  <!-- 1. 客户端层 -->
  <rect x="150" y="85" width="600" height="75" rx="10" fill="url(#clientGradient)" filter="url(#shadow)"/>
  <text x="450" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">客户端层 (Client Layer)</text>
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="13" fill="white">Admin UI</text>
  <text x="320" y="140" font-family="Arial, sans-serif" font-size="13" fill="white">React Apps</text>
  <text x="450" y="140" font-family="Arial, sans-serif" font-size="13" fill="white">Public Apps</text>
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="13" fill="white">Theme Engine</text>
  
  <!-- 箭头 -->
  <line x1="450" y1="160" x2="450" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 2. Web 层 -->
  <rect x="150" y="185" width="600" height="75" rx="10" fill="url(#webGradient)" filter="url(#shadow)"/>
  <text x="450" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Web 层 (Express Routing)</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="13" fill="white">Admin Web</text>
  <text x="320" y="240" font-family="Arial, sans-serif" font-size="13" fill="white">API Web</text>
  <text x="450" y="240" font-family="Arial, sans-serif" font-size="13" fill="white">Members Web</text>
  <text x="580" y="240" font-family="Arial, sans-serif" font-size="13" fill="white">Frontend Web</text>
  
  <!-- 箭头 -->
  <line x1="450" y1="260" x2="450" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 3. API 层 -->
  <rect x="150" y="285" width="600" height="75" rx="10" fill="url(#apiGradient)" filter="url(#shadow)"/>
  <text x="450" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">API 层 (RESTful Endpoints)</text>
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="13" fill="white">Posts API</text>
  <text x="320" y="340" font-family="Arial, sans-serif" font-size="13" fill="white">Users API</text>
  <text x="450" y="340" font-family="Arial, sans-serif" font-size="13" fill="white">Members API</text>
  <text x="580" y="340" font-family="Arial, sans-serif" font-size="13" fill="white">Settings API</text>
  
  <!-- 箭头 -->
  <line x1="450" y1="360" x2="450" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 4. 服务层 -->
  <rect x="150" y="385" width="600" height="75" rx="10" fill="url(#serviceGradient)" filter="url(#shadow)"/>
  <text x="450" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">服务层 (Business Logic)</text>
  <text x="180" y="440" font-family="Arial, sans-serif" font-size="13" fill="white">Posts Service</text>
  <text x="290" y="440" font-family="Arial, sans-serif" font-size="13" fill="white">Email Service</text>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="13" fill="white">Members Service</text>
  <text x="520" y="440" font-family="Arial, sans-serif" font-size="13" fill="white">Auth Service</text>
  <text x="630" y="440" font-family="Arial, sans-serif" font-size="13" fill="white">Theme Service</text>
  
  <!-- 箭头 -->
  <line x1="450" y1="460" x2="450" y2="480" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 5. 模型层 -->
  <rect x="150" y="485" width="600" height="75" rx="10" fill="url(#modelGradient)" filter="url(#shadow)"/>
  <text x="450" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">模型层 (ORM - Bookshelf/Knex)</text>
  <text x="200" y="540" font-family="Arial, sans-serif" font-size="13" fill="white">Post Model</text>
  <text x="320" y="540" font-family="Arial, sans-serif" font-size="13" fill="white">User Model</text>
  <text x="450" y="540" font-family="Arial, sans-serif" font-size="13" fill="white">Member Model</text>
  <text x="580" y="540" font-family="Arial, sans-serif" font-size="13" fill="white">Tag Model</text>
  
  <!-- 箭头 -->
  <line x1="450" y1="560" x2="450" y2="580" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 6. 数据层 -->
  <rect x="150" y="585" width="600" height="75" rx="10" fill="url(#dbGradient)" filter="url(#shadow)"/>
  <text x="450" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">数据层 (Database &amp; Storage)</text>
  <text x="200" y="640" font-family="Arial, sans-serif" font-size="13" fill="white">MySQL Database</text>
  <text x="340" y="640" font-family="Arial, sans-serif" font-size="13" fill="white">Redis Cache</text>
  <text x="480" y="640" font-family="Arial, sans-serif" font-size="13" fill="white">File Storage</text>
  <text x="630" y="640" font-family="Arial, sans-serif" font-size="13" fill="white">S3/CDN</text>
  
  <!-- 侧边说明 -->
  <rect x="20" y="200" width="100" height="300" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="70" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">请求流向</text>
  <text x="70" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">↓</text>
  <text x="70" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">HTTP</text>
  <text x="70" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">Request</text>
  <text x="70" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">→</text>
  <text x="70" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">响应</text>
  <text x="70" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">↑</text>
  <text x="70" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">HTTP</text>
  <text x="70" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">Response</text>
</svg>
